name: Release

on:
  push:
    tags: ["*-v*"]
  # Rebuild only the catalog, e.g. after a failed run.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Only release reviewed commits
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test
        run: python -m unittest discover -s tests -t .

      - name: Build the avatar tar
        run: python scripts/pack "$TAG" dist

      # A published release is never replaced. On a re-run, an existing release
      # is accepted only if it holds exactly the tar just built.
      - name: Publish the avatar release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$TAG" -p '*.tar.sha256' -D existing
            cmp existing/"$TAG".tar.sha256 dist/"$TAG".tar.sha256
            echo "$TAG is already released with the same tar"
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes ""
          fi

  catalog:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Each run rebuilds the catalog from every release, so a superseded pending run may be dropped.
    concurrency:
      group: catalog
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The catalog follows main, not the tagged commit, so an older tag cannot roll it back.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make sure the catalog release exists
        run: gh release view catalog >/dev/null 2>&1 || gh release create catalog --title catalog --notes "Avatar catalog"

      - name: Collect releases and checksums
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > releases.json
          mkdir -p sums
          for tag in $(jq -r '.[][] | select(.draft | not) | .tag_name | select(test("-v[0-9]+$"))' releases.json); do
            gh release download "$tag" -p '*.tar.sha256' -D sums --clobber
          done

      - name: Build the catalog
        run: |
          python scripts/catalog --releases releases.json --sums sums \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --out dist-catalog/catalog.json

      # --clobber replaces each asset in turn: catalog.json is briefly missing,
      # which readers must treat as a retryable failure.
      - name: Publish the catalog
        run: gh release upload catalog dist-catalog/* --clobber
